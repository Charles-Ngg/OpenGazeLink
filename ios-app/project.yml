name: OpenGazeLink
options:
  bundleIdPrefix: com.eyetracing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  OpenGazeLink:
    type: application
    platform: iOS
    sources:
      - path: OpenGazeLink
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyetracing.opengazelink
        PRODUCT_NAME: OpenGazeLink
        INFOPLIST_FILE: OpenGazeLink/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenGazeLink/OpenGazeLink.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    scheme:
      testTargets:
        - OpenGazeLinkTests
      gatherCoverageData: true

  OpenGazeLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenGazeLinkTests
    dependencies:
      - target: OpenGazeLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyetracing.opengazelinkTests
        GENERATE_INFOPLIST_FILE: "YES"
