name: PC tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PC dependencies
        working-directory: pc-provider
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run PC tests
        working-directory: pc-provider
        run: python -m unittest discover -s tests -q
      - name: Validate web script
        working-directory: pc-provider
        run: |
          Get-ChildItem web/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check control and capture contracts
        working-directory: pc-provider
        run: |
          foreach ($script in @('check_control_contract', 'check_spatial_plan', 'check_event_plan', 'check_unified_plan', 'check_prediction_plan')) {
            node "tools/$script.cjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
